<a class="fitnessapp-profile-item" href="{% url 'workoutsession-do' item.id %}">
    <div class="row fitnessapp-bg-color-content-lighter fitnessapp-border-color-content-light">
        <div class="col-auto pt-2 pb-2 bg-white font-monospace">
            <span class="text-secondary fw-bolder"><small>{{ item.scheduled_time|date:'h:i A'}}</small></span>
        </div>
        <div class="col pt-2 pb-2 fitnessapp-bg-color-content-lighter">
            <span class="text-black-50 fw-bolder"><small>{{ item.person.first_name}}</small></span>
        </div>
        {% if item.status == "COMPLETED" %}
        <div class="col-1 fitnessapp-bg-color-content-lighter text-end d-flex align-items-center">
            <i class="bi bi-check-lg"></i>
        </div>
        {% endif %}
    </div>
</a>
