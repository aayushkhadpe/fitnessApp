{% extends "base/base.html" %}
{% load crispy_forms_tags %}
{% load widget_tweaks %}

{% block title %}Delete Session{% endblock %}

{% block content %}

<form method="post" onsubmit="disableSubmitButton()">
    {% csrf_token %}

    <div class="row mb-3">
        <div class="col-12 text-center">
            <span class="text-secondary">Are you sure you want to delete this session?</span>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col text-start">
            <a href="{% url 'home' %}">
            <button class="btn btn-secondary" type="button">Cancel</button>
            </a>
        </div>
        <div class="col text-end">
            <button id="id-submit-button" class="btn btn-danger" type="submit">Confirm Delete</button>
        </div>
    </div>

</form>

{% block scripts %}
<script>
    function disableSubmitButton()
    {
        var btn = document.getElementById('id-submit-button');
        btn.disabled = true;
        btn.innerText = 'Deleting...';
    }

</script>
{% endblock %}

{% endblock %}
