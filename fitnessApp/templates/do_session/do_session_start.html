<div id="id-do-session-start" class="do-session-start">
    <div class="row mt-3 mb-3">
        <div class="col text-center">
            <span class="text-secondary">Turn off silent mode on your phone, and turn up the volume to hear the timer beeps.</span>
        </div>
    </div>

    <div class="row mt-3 mb-3">
        <div class="col-12 w-100 text-center">
        </div>
    </div>
    
    <div class="row mt-3 mb-3">
        <div class="col-12 w-100 text-center">
            <button class="btn btn-primary" onClick="startWorkout()" type="submit">{% if object.current_step_sequence == 1 %}Start Workout! {% else %}Resume Workout! {% endif %}</button>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col-6 text-start">
            <a class="btn btn-outline-secondary" href="{% url 'workoutsession-reschedule' object.id %}">
                <i class="bi bi-arrow-clockwise"></i><span><small>&nbsp;Reschedule</small></span>
            </a>
        </div>
        <div class="col-6 text-end pe-3">
            <a class="btn btn-outline-secondary" href="{% url 'workoutsession-delete' object.id %}">
                <i class="bi bi-trash"></i><span><small>&nbsp;Delete</small></span>
            </a>
        </div>
    </div>

</div>
